services:
  app:
    build: .
    depends_on:
      - electrs
      - litecoind
    environment:
      ELECTRUM_HIDDEN_SERVICE: "notyetset.onion"
      ELECTRUM_LOCAL_SERVICE: "localhost"
      ELECTRUM_PORT: "51001"
      ELECTRS_HOST: electrs
      ELECTRS_PORT: "50002"
      LITECOIN_HOST: litecoind
      RPC_PORT: "19443"
      RPC_USER: umbrel
      RPC_PASSWORD: umbrel
    ports:
      - "3006:3006"
    restart: on-failure

  electrs:
    image: local/umbrel-electrs-ltc:0.9.12
    depends_on:
      - litecoind
    environment:
      ELECTRS_LOG_FILTERS: INFO
      ELECTRS_NETWORK: regtest
      ELECTRS_DAEMON_RPC_ADDR: litecoind:19443
      ELECTRS_DAEMON_P2P_ADDR: litecoind:19444
      ELECTRS_ELECTRUM_RPC_ADDR: 0.0.0.0:50002
      ELECTRS_SERVER_BANNER: Electrs (LTC)
      ELECTRS_AUTH: "umbrel:umbrel"
      ELECTRS_DB_DIR: /data/db
    volumes:
      - ./data/electrs:/data/db
    ports:
      - "50002:50002"
    restart: on-failure

  litecoind:
    image: litecoinproject/litecoin-core:0.21.5.5@sha256:d541077a067257620648371ab88cc1fb7eb3b738ad3fc8981d75008a73df3561
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=umbrel
      - -rpcpassword=umbrel
      - -rpcport=19443
      - -port=19444
      - -fallbackfee=0.0002
    volumes:
      - ./data/litecoin:/home/litecoin/.litecoin
    restart: on-failure
